name: Home Hunter Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
    - cron: "15 16 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize database
        run: python -m home_hunter --db data/home_hunter.sqlite3 init

      - name: Import watchlist
        run: python -m home_hunter --db data/home_hunter.sqlite3 import-csv config/watchlist.csv

      - name: Detect duplicates
        run: python -m home_hunter --db data/home_hunter.sqlite3 dedupe

      - name: Check known listings
        run: python -m home_hunter --db data/home_hunter.sqlite3 check --limit 40

      - name: Generate report
        run: python -m home_hunter --db data/home_hunter.sqlite3 report --out reports/latest.md

      - name: Commit updated history and report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Home Hunter monitoring report"
          file_pattern: "data/home_hunter.sqlite3 reports/latest.md"
