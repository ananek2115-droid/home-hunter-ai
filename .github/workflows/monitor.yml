name: Home Hunter Monitor

on:
  push:
    branches: [main]
    paths: ['home_hunter/**', 'config/**', '.github/workflows/monitor.yml']
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
    - cron: "15 16 * * *"

permissions:
  contents: write

concurrency:
  group: home-hunter-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Initialize database
        run: python -m home_hunter --db data/home_hunter.sqlite3 init

      - name: Import watchlist
        run: python -m home_hunter --db data/home_hunter.sqlite3 import-csv config/watchlist.csv

      - name: Import official property RSS
        run: python -m home_hunter --db data/home_hunter.sqlite3 discover-feeds
        continue-on-error: true

      - name: Verify newly discovered candidates
        run: python -m home_hunter --db data/home_hunter.sqlite3 verify-new --limit 12

      - name: Discover new listings (Bing RSS)
        run: python -m home_hunter --db data/home_hunter.sqlite3 discover
        continue-on-error: true

      - name: Detect duplicates
        run: python -m home_hunter --db data/home_hunter.sqlite3 dedupe

      - name: Check known listings
        run: python -m home_hunter --db data/home_hunter.sqlite3 check --limit 40

      - name: Generate report
        run: python -m home_hunter --db data/home_hunter.sqlite3 report --out reports/latest.md

      - name: Commit updated history and report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Home Hunter monitoring report"
          file_pattern: "data/home_hunter.sqlite3 reports/latest.md"
